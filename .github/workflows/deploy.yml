##############################################################################
# GitHub Actions — Stellar OMS  Full CI/CD Pipeline
# Triggers: push to main  →  test → terraform → lambda → frontend → done
##############################################################################

name: Deploy Stellar OMS

on:
  workflow_dispatch:
    inputs:
      run_terraform:
        description: 'Run terraform apply (for infra changes)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION:   us-east-1
  TF_VERSION:   1.6.6
  NODE_VERSION: "20"

##############################################################################
# JOB 1 — Build & test the React app
##############################################################################
jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install deps
        working-directory: frontend
        run: npm install

      - name: Build (compile check)
        working-directory: frontend
        env:
          # Placeholder values — build validates compilation only
          REACT_APP_SUPABASE_URL:      https://placeholder.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: placeholder-anon-key
          REACT_APP_API_BASE_URL:      https://placeholder-api.execute-api.ap-south-1.amazonaws.com
          REACT_APP_WHATSAPP_NUMBER:   "919637655556"
          REACT_APP_NR_LICENSE_KEY:    placeholder-nr-key
          CI: false
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1
  
  ##############################################################################
  # JOB 2 — Terraform (Backend bootstrap + plan/apply)
  ##############################################################################

  bootstrap:
    name: 🛠 Bootstrap state backend
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Create S3 state bucket (idempotent)
        run: |
          BUCKET="${{ secrets.TF_BACKEND_BUCKET }}"
          REGION="${{ secrets.TF_BACKEND_REGION }}"
          echo "→ Ensuring Terraform state bucket: $BUCKET in $REGION"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "✓ Bucket already exists"
          else
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            echo "✓ Bucket created"
          fi
          # Enable versioning (idempotent)
          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          # Block public access (idempotent)
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          echo "✓ Bucket hardened"

      - name: Create DynamoDB lock table (idempotent)
        run: |
          TABLE="${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}"
          REGION="${{ secrets.TF_BACKEND_REGION }}"
          echo "→ Ensuring DynamoDB lock table: $TABLE"
          if aws dynamodb describe-table --table-name "$TABLE" --region "$REGION" 2>/dev/null; then
            echo "✓ Table already exists"
          else
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            aws dynamodb wait table-exists --table-name "$TABLE" --region "$REGION"
            echo "✓ Table created"
          fi
  ##############################################################################
  # JOB 2 — Terraform (plan on PR, apply on main)
  ##############################################################################
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [build, bootstrap]
    if: github.ref == 'refs/heads/main' || github.event.inputs.run_terraform == 'true'
    defaults:
      run:
        working-directory: terraform
    outputs:
      s3_bucket: ${{ steps.outputs.outputs.s3_bucket }}
      cf_id:     ${{ steps.outputs.outputs.cf_id }}
      api_url:   ${{ steps.outputs.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="region=${{ secrets.TF_BACKEND_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true" \
            -input=false \
            -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -no-color \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -var="supabase_service_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="existing_acm_cert_arn=${{ secrets.ACM_CERT_ARN }}" \
            -out=tfplan 2>&1 | tee plan.txt

      - name: Terraform Apply
        working-directory: terraform
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Read Terraform outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: outputs
        run: |
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cf_id=$(terraform output -raw cloudfront_id)"       >> "$GITHUB_OUTPUT"
          echo "api_url=$(terraform output -raw api_gateway_url)"   >> "$GITHUB_OUTPUT"

  ##############################################################################
  # JOB 3 — Deploy Lambda functions
  ##############################################################################
  deploy-lambda:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: [build, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Install Lambda dependencies (all deps for bundling)
        working-directory: lambda
        run: npm install

      # ── esbuild — bundle each Lambda into a single minified file ──────────
      # This replaces the old approach of copying node_modules into each zip.
      # Result: each Lambda zip is ~700KB instead of 230MB+.
      # aws-sdk is excluded (provided by the Lambda Node.js 20 runtime).
      # shared/tracing.js is resolved at build time by esbuild — no copy needed.
      - name: Bundle all Lambdas with esbuild
        working-directory: lambda
        run: |
          mkdir -p dist
          for FN in create-order update-order-status update-order-items send-notification get-order-by-token; do
            echo "→ Bundling $FN..."
            ./node_modules/.bin/esbuild $FN/index.js \
              --bundle \
              --platform=node \
              --target=node20 \
              --outfile=dist/$FN/index.js \
              --external:aws-sdk \
              --minify
            echo "✓ $FN: $(du -sh dist/$FN/index.js | cut -f1)"
          done

      # ── create-order ──────────────────────────────────────────────────────
      - name: Package & deploy create-order
        working-directory: lambda
        run: |
          cd dist/create-order
          zip -q ../../create-order.zip index.js
          aws lambda update-function-code \
            --function-name stellar-oms-create-order \
            --zip-file fileb://../../create-order.zip \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name stellar-oms-create-order

      # ── update-order-status ───────────────────────────────────────────────
      - name: Package & deploy update-order-status
        working-directory: lambda
        run: |
          cd dist/update-order-status
          zip -q ../../update-order-status.zip index.js
          aws lambda update-function-code \
            --function-name stellar-oms-update-order-status \
            --zip-file fileb://../../update-order-status.zip \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name stellar-oms-update-order-status

      # ── send-notification ─────────────────────────────────────────────────
      - name: Package & deploy send-notification
        working-directory: lambda
        run: |
          cd dist/send-notification
          zip -q ../../send-notification.zip index.js
          aws lambda update-function-code \
            --function-name stellar-oms-send-notification \
            --zip-file fileb://../../send-notification.zip \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name stellar-oms-send-notification

      # ── Inject Gmail secrets into Lambda env vars (kept out of Terraform state) ──
      - name: Store Gmail secrets in SSM Parameter Store
        run: |
          # Only create parameters when secrets have values
          if [ -n "${{ secrets.GMAIL_CLIENT_ID }}" ]; then
            aws ssm put-parameter --name "/stellar-oms/gmail/client-id" \
              --value "${{ secrets.GMAIL_CLIENT_ID }}" --type SecureString --overwrite --no-cli-pager
          fi
          if [ -n "${{ secrets.GMAIL_CLIENT_SECRET }}" ]; then
            aws ssm put-parameter --name "/stellar-oms/gmail/client-secret" \
              --value "${{ secrets.GMAIL_CLIENT_SECRET }}" --type SecureString --overwrite --no-cli-pager
          fi
          if [ -n "${{ secrets.GMAIL_REFRESH_TOKEN }}" ]; then
            aws ssm put-parameter --name "/stellar-oms/gmail/refresh-token" \
              --value "${{ secrets.GMAIL_REFRESH_TOKEN }}" --type SecureString --overwrite --no-cli-pager
          fi
          GMAIL_SENDER_VAL="${{ secrets.GMAIL_SENDER }}"
          GMAIL_SENDER_VAL="${GMAIL_SENDER_VAL:-orders@stellarglobalsupplies.com}"
          aws ssm put-parameter --name "/stellar-oms/gmail/sender" \
            --value "$GMAIL_SENDER_VAL" --type String --overwrite --no-cli-pager

      # ── get-order-by-token ─────────────────────────────────────────────────────
      - name: Package & deploy get-order-by-token
        working-directory: lambda
        run: |
          cd dist/get-order-by-token
          zip -q ../../get-order-by-token.zip index.js
          aws lambda update-function-code \
            --function-name stellar-oms-get-order-by-token \
            --zip-file fileb://../../get-order-by-token.zip \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name stellar-oms-get-order-by-token

      # ── update-order-items ─────────────────────────────────────────────────────
      - name: Package & deploy update-order-items
        working-directory: lambda
        run: |
          cd dist/update-order-items
          zip -q ../../update-order-items.zip index.js
          aws lambda update-function-code \
            --function-name stellar-oms-update-order-items \
            --zip-file fileb://../../update-order-items.zip \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name stellar-oms-update-order-items

      - name: Store invoice bucket in SSM
        run: |
          INVOICE_BUCKET="${{ needs.terraform.outputs.invoice_bucket_name }}"
          if [ -z "$INVOICE_BUCKET" ]; then
            INVOICE_BUCKET=$(aws ssm get-parameter --name /stellar-oms/invoice-bucket --query Parameter.Value --output text 2>/dev/null || echo "stellar-oms-invoices-production")
          fi
          aws ssm put-parameter --name "/stellar-oms/invoice-bucket" \
            --value "$INVOICE_BUCKET" --type String --overwrite --no-cli-pager
          echo "INVOICE_BUCKET=$INVOICE_BUCKET" >> $GITHUB_ENV

      - name: Inject Gmail + OTLP env vars into Lambda environment variables
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          NR_LICENSE_KEY: ${{ secrets.NR_LICENSE_KEY }}
        run: |
          GMAIL_SENDER="${GMAIL_SENDER:-orders@stellarglobalsupplies.com}"
          # NR ingest key is injected as OTEL_EXPORTER_OTLP_HEADERS.
          # Lambda env vars are encrypted at rest (KMS) in AWS — safe for ingest keys.
          OTLP_HEADERS="api-key=${NR_LICENSE_KEY}"
          for FN in "stellar-oms-create-order" "stellar-oms-update-order-status" "stellar-oms-send-notification" "stellar-oms-get-order-by-token" "stellar-oms-update-order-items"; do
            echo "→ Injecting Gmail env vars into $FN"
            # Get current env vars, merge Gmail secrets
            CURRENT_ENV_JSON=$(aws lambda get-function-configuration --function-name "$FN" \
              --query 'Environment.Variables' --output json)
            # Build the Variables inline string: KEY=VALUE,KEY2=VALUE2 format
            # First merge the Gmail secrets into the JSON, then convert to CLI inline format
            MERGED_JSON=$(echo "$CURRENT_ENV_JSON" | jq \
              --arg id "${GMAIL_CLIENT_ID}" \
              --arg secret "${GMAIL_CLIENT_SECRET}" \
              --arg token "${GMAIL_REFRESH_TOKEN}" \
              --arg sender "${GMAIL_SENDER}" \
              --arg bucket "${{ needs.terraform.outputs.invoice_bucket_name }}" \
              --arg otlp_headers "${OTLP_HEADERS}" \
              --arg otel_svc "sgs-orders-app" \
              --arg otel_env "production" \
              '. + {GMAIL_CLIENT_ID: $id, GMAIL_CLIENT_SECRET: $secret, GMAIL_REFRESH_TOKEN: $token, GMAIL_SENDER: $sender, INVOICE_BUCKET_NAME: $bucket, OTEL_EXPORTER_OTLP_HEADERS: $otlp_headers, OTEL_SERVICE_NAME: $otel_svc, ENVIRONMENT: $otel_env}')
            # Write full update payload as JSON and use --cli-input-json
            jq -n \
              --arg fn "$FN" \
              --argjson env "$MERGED_JSON" \
              '{FunctionName: $fn, Environment: {Variables: $env}}' \
              > /tmp/lambda_update.json
            aws lambda update-function-configuration \
              --cli-input-json file:///tmp/lambda_update.json \
              --no-cli-pager
            echo "✓ $FN updated"
          done

  ##############################################################################
  # JOB 4 — Build with real env vars & deploy to S3 + CloudFront
  ##############################################################################
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build, terraform, deploy-lambda]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # Resolve bucket + CF ID (terraform outputs → SSM fallback → secret fallback)
      - name: Resolve deployment targets
        id: targets
        run: |
          S3="${{ needs.terraform.outputs.s3_bucket }}"
          CF="${{ needs.terraform.outputs.cf_id }}"
          API="${{ needs.terraform.outputs.api_url }}"
          if [ -z "$S3" ]; then
            S3=$(aws ssm get-parameter --name /stellar-oms/s3-bucket --query Parameter.Value --output text 2>/dev/null || echo "${{ secrets.S3_BUCKET_NAME }}")
          fi
          if [ -z "$CF" ]; then
            CF=$(aws ssm get-parameter --name /stellar-oms/cf-distribution-id --query Parameter.Value --output text 2>/dev/null || echo "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}")
          fi
          if [ -z "$API" ]; then
            API=$(aws ssm get-parameter --name /stellar-oms/api-url --query Parameter.Value --output text 2>/dev/null || echo "${{ secrets.API_BASE_URL }}")
          fi
          echo "s3=$S3"   >> "$GITHUB_OUTPUT"
          echo "cf=$CF"   >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"

      - name: Install deps
        working-directory: frontend
        run: npm install

      - name: Build React app (production)
        working-directory: frontend
        env:
          REACT_APP_SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REACT_APP_API_BASE_URL:      ${{ steps.targets.outputs.api }}
          REACT_APP_WHATSAPP_NUMBER:   ${{ secrets.WHATSAPP_NUMBER }}
          # New Relic browser ingest key — baked into the JS bundle at build time.
          # This is intentional: NR ingest keys are write-only (they cannot read
          # data) so exposure in a public bundle carries no meaningful risk.
          # Rotate via GitHub secret NR_LICENSE_KEY if ever compromised.
          REACT_APP_NR_LICENSE_KEY:    ${{ secrets.NR_LICENSE_KEY }}
          CI: false
        run: npm run build

      # Hashed assets → long cache
      - name: Upload hashed assets to S3
        run: |
          aws s3 sync frontend/build/static \
            s3://${{ steps.targets.outputs.s3 }}/static \
            --cache-control "public,max-age=31536000,immutable" \
            --no-cli-pager

      # HTML + manifests → no cache
      - name: Upload HTML & manifests to S3
        run: |
          aws s3 sync frontend/build \
            s3://${{ steps.targets.outputs.s3 }} \
            --delete \
            --exclude "static/*" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --no-cli-pager

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ steps.targets.outputs.cf }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text \
            --no-cli-pager)
          echo "Invalidation ID: $INVALIDATION_ID"
          echo "Waiting for invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ steps.targets.outputs.cf }} \
            --id $INVALIDATION_ID

      - name: Deployment summary
        run: |
          echo "## ✅ Stellar OMS Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 OMS URL | https://orders.stellarglobalsupplies.com |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 S3 Bucket | \`${{ steps.targets.outputs.s3 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ☁️ CloudFront | \`${{ steps.targets.outputs.cf }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 API URL | \`${{ steps.targets.outputs.api }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔖 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY